<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>New York Burger — Pedir desde la mesa</title>
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
  </head>
  <body class="min-h-screen scroll-smooth bg-slate-50 font-sans text-slate-900">
    <header class="sticky top-0 z-40 flex h-14 items-center justify-between border-b border-slate-200/80 bg-white/95 px-4 backdrop-blur-md">
      <h1 class="text-lg font-black tracking-tight text-slate-900">New York Burger</h1>
      <div class="inline-flex items-center gap-1.5 rounded-full border border-emerald-200/60 bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-800">
        <span class="h-2 w-2 animate-pulse rounded-full bg-emerald-500" aria-hidden="true"></span>
        <span id="table-label"></span>
      </div>
    </header>

    <nav
      id="category-nav-root"
      aria-label="Categorías del menú"
      class="sticky top-14 z-30 flex gap-2 overflow-x-auto border-b border-slate-100 bg-white/95 px-4 py-2.5 backdrop-blur-md"
    ></nav>

    <main class="mx-auto flex max-w-xl flex-col gap-6 p-4 pb-28">
      <div id="receipt-root" class="scroll-mt-28"></div>
      <section id="menu-root" aria-label="Menú" class="flex flex-col gap-4"></section>
      <div id="menu-scroll-spacer" aria-hidden="true"></div>
    </main>

    <div id="table-modal-root"></div>
    <div id="cart-sheet-root"></div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
